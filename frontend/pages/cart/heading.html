{# Basket page: top. Styles: css/cart/heading.css #}
<header class="basket-head">
    <p class="basket-head__meta">
        <span class="basket-head__index">(03)</span>
        <span>Checkout · step 1 of 3</span>
    </p>

    <h1 class="basket-head__title" data-split>Your basket</h1>

    <p class="basket-head__count" data-basket-count aria-live="polite">Loading your basket…</p>

    <ol class="steps" aria-label="Checkout steps">
        <li class="steps__item is-current" aria-current="step">
            <span class="steps__dot" aria-hidden="true">1</span>
            <span class="steps__label">Basket</span>
        </li>
        <li class="steps__line" aria-hidden="true"></li>
        <li class="steps__item">
            <span class="steps__dot" aria-hidden="true">2</span>
            <span class="steps__label">Details</span>
        </li>
        <li class="steps__line" aria-hidden="true"></li>
        <li class="steps__item">
            <span class="steps__dot" aria-hidden="true">3</span>
            <span class="steps__label">Done</span>
        </li>
    </ol>
</header>
